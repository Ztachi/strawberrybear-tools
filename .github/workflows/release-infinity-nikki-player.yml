name: 'Release: infinity-nikki-player'

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-infinity-nikki-player.yml'
      - 'apps/infinity-nikki-player/**'
      - '!apps/infinity-nikki-player/**/*.md'
      - 'packages/keystroke-sequencer/**'
      - 'packages/piano-roll/**'
      - 'packages/player/**'
  workflow_dispatch:

# 发布全过程串行，不取消正在上传的任务；脚本仍拒绝旧版本晚到覆盖。
concurrency:
  group: infinity-nikki-player-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LC_ALL: C.UTF-8
  LANG: en_US.UTF-8
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      version: ${{ steps.release.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - name: 校验发布策略
        run: node --test apps/infinity-nikki-player/scripts/updater-release.test.mjs
      - name: 比较版本并创建或恢复草稿
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node apps/infinity-nikki-player/scripts/updater-release.mjs prepare

  build:
    needs: prepare
    if: needs.prepare.outputs.mode == 'build'
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: true
      # 官方 action 会读取并合并 latest.json，两个平台不能同时更新它。
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'apps/infinity-nikki-player/src-tauri -> target'
      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - name: 校验前端及原生更新流程
        run: |
          pnpm --filter @strawberrybear/infinity-nikki-player test
          cargo test --locked --manifest-path apps/infinity-nikki-player/src-tauri/Cargo.toml updater::
      - name: 导入 Apple Developer 证书
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_INFINITY_NIKKI_PLAYER }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD_INFINITY_NIKKI_PLAYER }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD_INFINITY_NIKKI_PLAYER }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "未配置 Apple 签名证书，沿用现有签名策略。"
            exit 0
          fi
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -hex 16)}"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$CERT_ID" ]; then
            echo "未找到有效的 Developer ID Application 签名身份。"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
      - name: 官方构建、签名及合并更新清单
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_INFINITY_NIKKI_PLAYER }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/infinity-nikki-player
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: infinity-nikki-player@v${{ needs.prepare.outputs.version }}
          releaseDraft: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: 校验实际包内版本并上传凭据
        run: node apps/infinity-nikki-player/scripts/updater-release.mjs verify-bundle

  publish:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.prepare.outputs.mode == 'repair') }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - name: 安装官方签名验证工具
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: 校验完整产物、公开版本并推进固定更新入口
        run: node apps/infinity-nikki-player/scripts/updater-release.mjs publish
