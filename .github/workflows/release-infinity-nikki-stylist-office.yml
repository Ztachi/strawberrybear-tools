name: 'Release: infinity-nikki-stylist-office'

on:
  push:
    branches:
      - main
    paths:
      - 'apps/infinity-nikki-stylist-office/**'
      - '!apps/infinity-nikki-stylist-office/**/*.md'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LC_ALL: C.UTF-8
  LANG: en_US.UTF-8

jobs:
  deploy-pages:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @strawberrybear/infinity-nikki-stylist-office build

      - name: Deploy to Cloudflare Pages
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          npx wrangler pages deploy apps/infinity-nikki-stylist-office/dist \
            --project-name=infinity-nikki-stylist-office \
            --branch=production \
            --commit-message="ci: deploy ${COMMIT_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @strawberrybear/infinity-nikki-stylist-office build

      - name: Get app version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/infinity-nikki-stylist-office/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check release tag
        id: release_tag
        run: |
          TAG_NAME="infinity-nikki-stylist-office@v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip release (tag exists)
        if: steps.release_tag.outputs.exists == 'true'
        run: 'echo "Skip release: tag already exists"'

      - name: Package dist
        if: steps.release_tag.outputs.exists != 'true'
        run: |
          cd apps/infinity-nikki-stylist-office
          zip -r "$RUNNER_TEMP/infinity-nikki-stylist-office-dist.zip" dist/

      - name: Get changelog entry
        id: changelog
        if: steps.release_tag.outputs.exists != 'true'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          CONTENT=$(awk "/^## ${VERSION}/{flag=1; next} /^## [0-9]/{if(flag) exit} flag" apps/infinity-nikki-stylist-office/CHANGELOG.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.release_tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: false
          tag_name: infinity-nikki-stylist-office@v${{ steps.version.outputs.version }}
          name: infinity-nikki-stylist-office@v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.content }}
          files: ${{ runner.temp }}/infinity-nikki-stylist-office-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
