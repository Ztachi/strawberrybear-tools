name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LC_ALL: C.UTF-8
  LANG: en_US.UTF-8

jobs:
  build:
    name: Build and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, Type check, and Lint
        run: pnpm turbo run build type-check lint --filter=...[HEAD^1]

      - name: 校验播放器发布策略与更新界面状态
        run: |
          node --test apps/infinity-nikki-player/scripts/updater-release.test.mjs
          pnpm --filter @strawberrybear/infinity-nikki-player test

  updater-native:
    name: 原生更新故障测试
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'apps/infinity-nikki-player/src-tauri -> target'
      - run: 'cargo test --locked --manifest-path apps/infinity-nikki-player/src-tauri/Cargo.toml updater::'
